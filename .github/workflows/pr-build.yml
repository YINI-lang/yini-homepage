name: CI Build

on:
    pull_request:

permissions:
    contents: read

jobs:
    build:
        name: Build site
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build site
              run: npm run build
