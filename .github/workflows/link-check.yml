# Check internal links with Lychee.
name: Check internal links

on:
    pull_request:
    push:
        branches: [main]

jobs:
    link-check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build Astro site
              run: npm run build

            - name: Check internal links with Lychee
              uses: lycheeverse/lychee-action@v1
              with:
                  args: >
                      --verbose
                      --no-progress
                      --accept 200,204
                      --exclude-mail
                      --crawl   # IMPORTANT: To see links inside pages.
                      --max-concurrency 8
                      --root-dir ./dist # IMPORTANT: So internal link starting with / are resolved correctly.
                      "./dist/**/*.html"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
